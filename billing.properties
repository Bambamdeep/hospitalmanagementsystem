server.port =8085
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password= sa
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.show-sql=true
springdoc.swagger-ui.path= /docs
resilience4j.circuitbreaker.instance.default.registerHealthIndicator= true ;
resilience4j.circuitbreaker.instances.patientClient.slidingWindowSize=10
resilience4j.circuitbreaker.instances.patientClient.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.patientClient.failureRateThreshold=50
resilience4j.circuitbreaker.instances.patientClient.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.patientClient.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.patientClient.slowCallRateThreshold=100

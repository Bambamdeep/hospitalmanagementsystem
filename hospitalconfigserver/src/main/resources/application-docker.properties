spring.application.name=hospitalconfigserver

server.port=8888

# ==========================
# Config Server Git Repository
# ==========================
spring.cloud.config.server.git.uri=https://github.com/Bambamdeep/hospitalmanagementsystem
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.clone-on-start=true

# ==========================
# Eureka Configuration
# ==========================
eureka.client.service-url.defaultZone=http://eureka:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ==========================
# Actuator
# ==========================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ==========================
# Logging
# ==========================
logging.level.org.springframework.cloud.config=INFO
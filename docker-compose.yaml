version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: hospital
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: deepak9089
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hospital"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  config-server:
    image: config-server:latest
    container_name: config-server
    restart: always
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hospital-network

  eureka:
    image: eureka-server:latest
    container_name: eureka
    restart: always
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - config-server
    networks:
      - hospital-network

  auth-service:
    image: auth-service:latest
    container_name: auth-service
    restart: always
    ports:
      - "1000:1000"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - postgres
      - config-server
      - eureka
    networks:
      - hospital-network

  patient:
    image: patient-service:latest
    container_name: patient
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - postgres
      - rabbitmq
      - config-server
      - eureka
      - auth-service
    networks:
      - hospital-network

  doctor:
    image: doctor-service:latest
    container_name: doctor
    restart: always
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - postgres
      - rabbitmq
      - config-server
      - eureka
      - auth-service
    networks:
      - hospital-network

  appointment:
    image: appointment-service:latest
    container_name: appointment
    restart: always
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - postgres
      - rabbitmq
      - config-server
      - eureka
      - auth-service
    networks:
      - hospital-network

  department:
    image: department-service:latest
    container_name: department
    restart: always
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - postgres
      - rabbitmq
      - config-server
      - eureka
      - auth-service
    networks:
      - hospital-network

  billing:
    image: billing-service:latest
    container_name: billing
    restart: always
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - postgres
      - rabbitmq
      - config-server
      - eureka
      - auth-service
    networks:
      - hospital-network

  gateway:
    image: gateway-service:latest
    container_name: gateway
    restart: always
    ports:
      - "8762:8762"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - patient
      - doctor
      - appointment
      - department
      - billing
      - auth-service
    networks:
      - hospital-network

volumes:
  postgres_data:

networks:
  hospital-network:
    driver: bridge
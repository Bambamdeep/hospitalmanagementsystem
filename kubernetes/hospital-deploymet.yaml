# ============================================================
# HOSPITAL MANAGEMENT SYSTEM - KUBERNETES DEPLOYMENT
# ============================================================

# ============================================================
# 1. POSTGRESQL
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: hospital
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: hospital

            - name: POSTGRES_USER
              value: postgres

            - name: POSTGRES_PASSWORD
              value: deepak9089

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-storage
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: hospital
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP


# ============================================================
# 2. RABBITMQ
# ============================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: hospital
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5672
            - containerPort: 15672

---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: hospital
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672

    - name: management
      port: 15672
      targetPort: 15672

  type: ClusterIP


